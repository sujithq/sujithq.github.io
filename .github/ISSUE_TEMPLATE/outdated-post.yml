name: Report an outdated step
description: Tell us when a blog post no longer matches what you see in your version of a tool.
title: "[outdated] "
labels:
  - outdated-post
body:
  - type: input
    id: post
    attributes:
      label: Post URL
      description: The blog post that is out of date.
      placeholder: https://quintelier.dev/posts/...
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool and version
      description: The tool, service or SDK and its version, for example "VS Code 1.142.0", "Copilot CLI 1.0.98" or "Azure CLI 2.80.0".
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: What does the post say?
      description: The step, setting or screenshot that no longer matches. Quote it or give the heading.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What do you see now?
      description: The exact labels, menu path, setting names or command output you see instead, for example "Model picker > Copilot tab shows 'Ensemble' and 'Ensemble Max'; HydraFusion is not listed". You can paste a screenshot here.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Release note or documentation link
      description: Optional. A link that describes the change, if you know one.
    validations:
      required: false
