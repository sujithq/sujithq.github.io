name: Dependency Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: '.python-version'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Install and audit JavaScript dependencies
        run: |
          npm ci
          npm audit --audit-level=low

      - name: Restore and build the crawler
        run: |
          dotnet restore src/Crawler/Crawler.csproj --locked-mode --configfile nuget.config
          dotnet build src/Crawler/Crawler.csproj --configuration Release --no-restore

      - name: Install and audit Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip_audit --vulnerability-service osv --strict
          python scripts/create_image.py --help

      - name: Install the test browser
        run: npx playwright install --with-deps msedge

      - name: Verify browser dependencies
        run: npx playwright test tests/dependency-assets.spec.ts tests/csp-violations.spec.ts --project="Microsoft Edge" --workers=1 --reporter=line