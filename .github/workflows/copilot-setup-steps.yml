      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
            hugo-version: "0.166.0"
            extended: true

      - name: Install JavaScript dependencies
        run: npm ci
